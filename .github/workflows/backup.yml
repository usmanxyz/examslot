name: Backup

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "stamp=$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_ENV"
          docker run --rm -v "$RUNNER_TEMP:/backup" postgres:16 \
            pg_dump --format=custom --no-owner --no-privileges \
            --file=/backup/examslot.dump "$BACKUP_DATABASE_URL"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 --output "$RUNNER_TEMP/examslot.dump.gpg" "$RUNNER_TEMP/examslot.dump"

      - uses: actions/upload-artifact@v5
        with:
          name: examslot-backup-${{ env.stamp }}
          path: ${{ runner.temp }}/examslot.dump.gpg
          retention-days: 28
