services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: examslot_owner
      POSTGRES_DB: examslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - examslot-db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examslot_owner -d examslot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  examslot-db-data:
